plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.stellarlens.stellarlens_camera'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        minSdk 19
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // The uni-app engine is supplied by the host app at runtime; compileOnly also keeps
    // this module able to produce a standalone AAR.
    compileOnly fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation libs.appcompat
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    // 1.3.0 is the last CameraX release whose runtime can be conditionally used below
    // API 21 (1.4.x declares minSdk 21, 1.5+ declares minSdk 23).
    def camerax_version = "1.3.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"
    implementation "androidx.concurrent:concurrent-futures:1.1.0"
}